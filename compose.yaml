services:
  gympass:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      APP_ORIGIN: http://localhost:3000
      DATABASE_PATH: /app/data/csp11.db
      BACKUP_PATH: /app/backups
    volumes:
      - gympass-data:/app/data
      - gympass-backups:/app/backups
    restart: unless-stopped
volumes:
  gympass-data:
  gympass-backups:
